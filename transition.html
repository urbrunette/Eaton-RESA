<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>transition site</title>
    <style>
      
    #one {
        width: 100px;
        height: 100px;
        background: plum;
        border: 2px solid palevioletred;
        transition:transform 2s,background 1s;
    }
    #one:hover{
transform: rotate(20deg) scale(2);
background: pink;
    }
    #two {
        width: 200px;
        height: 200px;
        background: purple;
        border:20px solid rgb(179, 4, 179);
        transition:border-radius1;                             
    }
    #two:hover{
 background: rgb(128, 28, 128);
 border-radius: 50%;
    }
    #three {
        width: 50px;
        height: 50px;
        background: blue;
        border: 10px solid rgb(15, 15, 191);
       transition: transform 5s, background 1s;
    }
    #three:hover{
        background: rgb(54, 54, 169);
        transform: rotate(5000000deg);
    
    }
    #four {
        width: 500px;
        height: 50px;
        background: green;
        border: 100px solid rgb(24, 186, 24) ;
        transition: transform 1s, background 1s;
    
    }
    #four:hover{
        background: rgb(47, 117, 47);
        transform: rotate(-1000000deg);
    }
    </style>
</head>

<body>
   <div id="one"></div>
   <div id="two"></div>
   <div id="three"></div>
   <div id="four"></div>
</body>

</html>
