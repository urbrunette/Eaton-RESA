<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>links</title>
    <style>
        a {
            color: rgb(55, 146, 221);
            font-weight: 900;
            text-decoration: overline;
        }

        a:hover {
            color: rgb(84, 117, 237);
            text-decoration: underline;
            display: block;
            border: 1px solid blue;
            width: 100px;
            padding: 10px;
        }

        .b {
            color: palevioletred;
            font-weight: 900;
            text-decoration: underline;
        }

        .b:hover {
            color: pink;
            text-decoration: overline;
            border: 2px dotted #f66c83;
            display: block;
            width: 200px;
            padding: 20px;
        }

        .c {
            color: purple;
            font-weight: 900;
            text-decoration: double;
        }

        .c:hover {
            color: rgb(203, 20, 203);
            text-decoration: line-through;
            border: 3px dotted rgb(255, 3, 255);
            display: block;
            width: 300px;
            padding: 30px;
        }
    </style>

</head>

<body>
    <p><a href="https://www.facebook.com/profile.php?id=61570005578341"> this is a link</a></p>
    <p><a class="b" href="https://www.facebook.com/profile.php?id=61570005578341"> this is a link</a></p>
    <p><a class="c" href="https://www.facebook.com/profile.php?id=61570005578341"> this is a link</a></p>

</body>

</html>
